<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prog YaL</title>
<meta name="theme-color" content="#110e22">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: RPG character screen. Sticky HUD (level, XP, cycle week) on top, four views below;
   the body map is the hero and every list hangs off it. Single dark look by choice (game screen). */
:root{
  color-scheme:dark;
  --bg:#110e22; --panel:#1b1736; --panel2:#262049; --line:#3b3372;
  --fg:#eeeaff; --dim:#a39cd0; --muscle:#342d63;
  --hit:#ff4d8d; --warm:#ff9f5a; --xp:#5ce1e6; --gold:#ffd166; --ok:#7dffb0;
  --display:"Chakra Petch","Trebuchet MS",sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --cut:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
*{box-sizing:border-box}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(rgba(92,225,230,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(92,225,230,.035) 1px,transparent 1px);background-size:32px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--xp);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.05rem;text-transform:uppercase;letter-spacing:.1em;color:var(--xp)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .small{font-size:.85rem}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(17,14,34,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.lvl{flex:none;width:52px;height:52px;display:grid;place-items:center;background:linear-gradient(135deg,var(--hit),#8a5cff);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font:700 1.35rem var(--display);color:#fff}
.who{flex:1 1 180px;min-width:0}
.who b{font:700 1.05rem var(--display)} .who .title{color:var(--gold);font:600 .8rem var(--display);text-transform:uppercase;letter-spacing:.1em;margin-left:8px}
.bar{height:10px;background:var(--panel2);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),#8a5cff);transition:width .6s}
.week{display:flex;align-items:center;gap:6px}
.week .lab{text-align:center;min-width:112px;line-height:1.15}
.week .lab b{font:700 1rem var(--display);display:block}
.week .lab span{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.ib{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);clip-path:var(--cut);font:700 1rem var(--display)}
.ib:hover{background:var(--panel2)}
.tabs{display:flex;gap:6px}
.tabs a{flex:1;text-align:center;padding:10px 14px;font:600 .82rem var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);text-decoration:none;border-bottom:3px solid transparent}
.tabs a.on{color:var(--fg);border-color:var(--hit)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(17,14,34,.97);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs a{border-bottom:0;border-top:3px solid transparent;padding:12px 4px}
main{padding-block:18px 150px;display:grid;gap:18px}
.note{font-size:.8rem;color:var(--dim);padding:6px 10px;border:1px dashed var(--line)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0;position:relative}
.panel::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--xp);border-left:2px solid var(--xp)}
.panel>h2{margin-bottom:10px}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.btn{border:0;background:var(--hit);color:#1a0612;font:700 .95rem var(--display);text-transform:uppercase;letter-spacing:.08em;padding:13px 20px;clip-path:var(--cut)}
.btn:hover{filter:brightness(1.1)} .btn.alt{background:var(--panel2);color:var(--fg)} .btn.sm{padding:8px 12px;font-size:.78rem}
.tag{display:inline-block;font:600 .68rem var(--display);text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);background:var(--panel2);color:var(--dim);white-space:nowrap}
.tag.boss{background:var(--hit);color:#1a0612} .tag.gold{background:var(--gold);color:#2a1d00} .tag.cy{background:var(--xp);color:#04262a} .tag.up{background:var(--ok);color:#06301a}
.prev{font-size:.8rem;color:var(--dim);margin:-4px 0 10px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.prog{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9rem;text-align:left}

/* day chips */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--panel);padding:8px 4px;text-align:center;clip-path:var(--cut);min-width:0}
.day b{font:700 1rem var(--display);display:block}
.day span{font-size:.72rem;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.on{background:var(--panel2);border-color:var(--hit)} .day.on b{color:var(--hit)}
.day.done b::after{content:" ✓";color:var(--ok)}

/* body map */
.map svg{display:block;width:100%;max-width:440px;margin:0 auto;height:auto}
.mu{fill:color-mix(in oklab,var(--hit) var(--p,0%),var(--muscle));stroke:var(--panel);stroke-width:1.5;stroke-linejoin:round;cursor:pointer;transition:fill .35s}
.mu.hot{filter:drop-shadow(0 0 5px var(--hit))}
.mu.bz{stroke:var(--gold);stroke-dasharray:3 2.5;stroke-width:1.1}
.mu:hover{stroke:var(--fg);stroke-dasharray:none}
.bs{fill:#2a2450;stroke:var(--panel);stroke-width:1.5;stroke-linejoin:round}
.map text{fill:var(--dim);font:600 11px var(--display);letter-spacing:.2em;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--dim);justify-content:center;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.mapinfo{min-height:2.9em;text-align:center;font-size:.88rem;margin-top:8px}

/* exercises */
.exs{display:grid;gap:10px}
.ex{background:var(--panel);border:1px solid var(--line);padding:12px;min-width:0}
.ex.sel{border-color:var(--hit);box-shadow:inset 3px 0 0 var(--hit)}
.ex.clear{border-color:color-mix(in oklab,var(--ok) 50%,var(--line))}
.exh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.exn{background:none;border:0;padding:0;text-align:left;font:600 1.02rem var(--display);min-width:0}
.exn:hover{color:var(--hit)}
.meta{font-size:.83rem;color:var(--dim);margin:3px 0 10px}
.meta b{color:var(--fg);font-family:var(--display);font-variant-numeric:tabular-nums}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{width:64px;height:54px;border:1px solid var(--line);background:var(--panel2);clip-path:var(--cut);display:grid;place-content:center;text-align:center;line-height:1.1;font-family:var(--display);font-variant-numeric:tabular-nums}
.set b{font-size:.98rem;display:block} .set span{font-size:.75rem;color:var(--dim)}
.set.done{background:var(--xp);border-color:var(--xp);color:#04262a} .set.done span{color:#0b4a50}
.adj{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;align-items:center;font-size:.8rem;color:var(--dim)}
.adj .g{display:flex;align-items:center;gap:5px}
.adj .ib{width:32px;height:32px;font-size:.9rem}
details{margin-top:10px;font-size:.88rem} summary{cursor:pointer;color:var(--xp);font:600 .78rem var(--display);text-transform:uppercase;letter-spacing:.1em}
details ul{margin:6px 0;padding-left:18px} details li{margin:2px 0}
a{color:var(--xp)}
.finish{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* tables / lists */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:600 .72rem var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
td{font-family:var(--display);font-variant-numeric:tabular-nums}
.cur{background:color-mix(in oklab,var(--hit) 18%,transparent);color:var(--fg)}
.prs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pr{background:var(--panel2);padding:10px;clip-path:var(--cut)}
.pr label{display:block;font-size:.78rem;color:var(--dim)}
.pr input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:700 1.5rem var(--display);padding:2px 0}
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tr{padding:10px;border:1px solid var(--line);background:var(--panel2)}
.tr b{font:600 .92rem var(--display);display:block} .tr span{font-size:.78rem;color:var(--dim)}
.tr.got{border-color:var(--gold)} .tr.got b{color:var(--gold)} .tr:not(.got){opacity:.55}
.rows{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel2);padding:9px 11px;min-width:0}
.row .l{min-width:0} .row .l b{font:600 .95rem var(--display)} .row .l div{font-size:.8rem;color:var(--dim)}
.row .r{text-align:right;flex:none;font-size:.82rem}
.x{background:none;border:1px solid var(--line);color:var(--dim);font-size:.72rem;padding:3px 7px;margin-left:8px}
.mbar{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:.86rem}
.mbar .bar{margin:0}
.mbar .bar i{background:linear-gradient(90deg,var(--warm),var(--hit))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.tile{background:var(--panel2);padding:10px;clip-path:var(--cut)} .tile b{font:700 1.4rem var(--display);display:block} .tile span{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.form label{font-size:.78rem;color:var(--dim);display:grid;gap:3px}
.form input,.form select{background:var(--panel2);border:1px solid var(--line);padding:8px;width:100%;min-width:0}
ol.steps{margin:0 0 12px;padding-left:20px} ol.steps li{margin:4px 0}
.drop{border:2px dashed var(--line);padding:18px;text-align:center}
.drop.over{border-color:var(--xp);background:var(--panel2)}

/* rest timer, toast, overlay */
#rest{position:fixed;left:0;right:0;bottom:calc(47px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--panel2);border-top:2px solid var(--xp)}
#rest .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
#rest b{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums;min-width:74px}
#rest .bar{flex:1;margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:9px 16px;font:600 .88rem var(--display);clip-path:var(--cut);max-width:calc(100% - 32px)}
.pop{position:fixed;z-index:21;pointer-events:none;font:700 1.1rem var(--display);color:var(--gold);animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translateY(-46px);opacity:0}}
#win{position:fixed;inset:0;z-index:30;background:rgba(10,8,22,.88);display:grid;place-items:center;padding:16px}
#win .panel{max-width:440px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;text-align:center;border-color:var(--gold);animation:in .35s ease-out}
@keyframes in{from{transform:scale(.9);opacity:0}}
#win h1{font-size:1.9rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
#win .tiles{margin:14px 0;text-align:left}
@media (min-width:860px){
  nav.tabs{position:static;background:none;border:0;padding:0;max-width:1120px;margin:0 auto;padding-left:16px;padding-right:16px}
  nav.tabs a{border-top:0;border-bottom:3px solid transparent;flex:none;padding:12px 18px}
  #rest{bottom:0} #toast{bottom:80px}
  main{padding-bottom:90px}
  .cols.two{grid-template-columns:minmax(0,400px) minmax(0,1fr);align-items:start}
  .cols.two>.stick{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="hud"><div class="wrap" id="hud"></div></header>
<nav class="tabs" id="tabs" aria-label="Views">
  <a href="#quests">Quests</a><a href="#body">Body</a><a href="#stats">Stats</a><a href="#garmin">Garmin</a>
</nav>
<main class="wrap" id="view"></main>
<div id="rest" hidden><div class="wrap"><span class="tag cy">Rest</span><b id="restT">0:00</b><div class="bar"><i id="restB"></i></div><button class="btn alt sm" data-act="rest+">+15s</button><button class="btn alt sm" data-act="restx">Skip</button></div></div>
<div id="toast" hidden role="status"></div>
<div id="win" hidden></div>

<script>
/* ---------- program data (from Loïc's coaching sheet) ---------- */
const MUS={chest:'Chest',upperChest:'Upper chest',frontDelt:'Front delts',sideDelt:'Side delts',rearDelt:'Rear delts',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',abs:'Abs',obliques:'Obliques',traps:'Traps',lats:'Lats',upperBack:'Upper back',lowerBack:'Lower back',glutes:'Glutes',quads:'Quads',adductors:'Adductors',hamstrings:'Hamstrings',calves:'Calves'};
const BONUS=['triceps','rearDelt','hamstrings','calves','upperChest'];
const CYCLE=[
 {s:5,r:5,p:.70,ph:'Accumulation',tip:'Clean technique, controlled speed.'},
 {s:5,r:4,p:.75,ph:'Accumulation',tip:'One rep less per set, load goes up.'},
 {s:5,r:3,p:.80,ph:'Accumulation',tip:'Last week of volume.'},
 {s:3,r:3,p:.65,ph:'Deload',tip:'Light loads. Recover and enjoy it.'},
 {s:4,r:3,p:.85,ph:'Intensification',tip:'Heavy sets, long rests.'},
 {s:3,r:2,p:.90,ph:'Intensification',tip:'Heavy doubles.'},
 {s:2,r:1,p:.95,ph:'Last heavy',tip:'Singles, nowhere near failure.'},
 {s:3,r:1,p:1,ph:'Boss fight',tip:'Open around 90%, hit your current 1RM, then go for the record. Rest 3 to 5 min. Stop if technique slips.'}];
const LIFTS={squat:'Squat',bench:'Bench press',deadlift:'Deadlift',press:'Strict press',pullup:'Weighted pull-up (added)',ohs:'Overhead squat',snatch:'Snatch',clean:'Power clean'};
const DEF_ORM={pullup:35,bench:100,squat:130,deadlift:155,press:65,ohs:80,snatch:75,clean:105};
const STEP=2.5,BAR=20,PULL_START=20;
const D='https://www.docteur-fitness.com/wp-content/uploads/';
const m=(P,S)=>({P:P.split(' '),S:S?S.split(' '):[]});
const DL=m('glutes hamstrings lowerBack','quads traps lats forearms upperBack'), BP=m('chest','triceps frontDelt upperChest');
const DAYS=[
 {n:'Deadlift',focus:'Heavy deadlift, back and posterior chain',ex:[
  {id:'dl',name:'Deadlift',kind:'cycle',lift:'deadlift',rest:180,rir:2,tempo:'1-1-X-0',demo:'https://performancessportives.com/souleve-de-terre-avec-pause/',mm:DL,tips:'deadlift'},
  {id:'calfst',name:'Élévations de mollets debout',kind:'acc',sets:3,reps:12,load:40,rest:60,rir:1,tempo:'2-1-1-1',demo:D+'2021/10/extension-mollets-debout-machine.gif',mm:m('calves')},
  {id:'bbrow',name:'Rowing barre',kind:'acc',sets:3,reps:8,load:80,rest:90,rir:2,demo:'https://go-muscu.com/wp-content/uploads/2026/01/exercice-musculation-rowing-barre-buste-penche-homme.gif',mm:m('lats upperBack','rearDelt biceps traps lowerBack forearms')},
  {id:'slrdl',name:'RDL unilatéral haltère',note:'Start with the left leg.',kind:'acc',sets:3,reps:8,unit:'/leg',load:10,rest:75,rir:2,tempo:'3-0-1-0',demo:'https://fitnessprogramer.com/wp-content/uploads/2022/09/Dumbbell-Single-Leg-Deadlift.gif',mm:m('hamstrings glutes','lowerBack adductors')}]},
 {n:'Bench',focus:'Bench and upper-body pushing',ex:[
  {id:'bp',name:'Bench press',kind:'cycle',lift:'bench',rest:180,rir:2,tempo:'2-0-X-0',demo:D+'2019/08/developpe-couche.gif',mm:BP,tips:'bench'},
  {id:'incl',name:'Développé incliné machine',kind:'acc',sets:3,reps:10,load:60,rest:90,rir:2,demo:D+'2000/06/developpe-incline-machine-convergente-exercice-musculation.gif',mm:m('upperChest','chest frontDelt triceps')},
  {id:'skull',name:'Skull crusher haltères',kind:'acc',sets:3,reps:10,load:10,rest:90,rir:2,tempo:'3-0-1-0',demo:'https://i.pinimg.com/originals/2b/22/90/2b22905614256e610257662a2ea92635.gif',mm:m('triceps')},
  {id:'tbar',name:'Rowing poitrine appuyée (T-bar)',kind:'acc',sets:3,reps:10,load:70,rest:90,rir:2,demo:'https://cdn.jefit.com/assets/img/exercises/gifs/355.gif',mm:m('upperBack lats','rearDelt biceps traps')},
  {id:'push',name:'Extension triceps poulie (corde)',kind:'acc',sets:3,reps:12,load:18,rest:75,rir:1,tempo:'2-0-1-1',demo:'https://media.tenor.com/mbebKudZjxYAAAAM/tr%C3%ADceps-pulley.gif',mm:m('triceps')}]},
 {n:'Oly',focus:'Weightlifting, core, hamstrings and calves',ex:[
  {id:'sn',name:'Snatch',kind:'oly',lift:'snatch',pct:.7,sets:4,reps:2,rest:150,demo:D+'2022/08/snatch-arrache-halterophilie.gif',mm:m('glutes quads traps','hamstrings lowerBack sideDelt frontDelt upperBack abs calves')},
  {id:'snpull',name:'Tirage arraché (snatch pull)',kind:'oly',lift:'snatch',pct:1,sets:3,reps:3,rest:150,demo:'https://api.smartworkout.app/asset/image/77325685-7a47-4aef-8431-beb93afc70ee',mm:m('traps glutes hamstrings','lowerBack quads calves forearms')},
  {id:'ohs',name:'Overhead squat',kind:'oly',lift:'ohs',pct:.75,sets:3,reps:4,rest:150,rir:2,demo:'https://www.journalmenu.com/wp-content/uploads/2017/11/overhead-squat-gif-front-slow-motion-overhead-squat-technique.gif',mm:m('quads glutes','abs sideDelt frontDelt traps upperBack adductors lowerBack')},
  {id:'hlr',name:'Relevé de jambes suspendu',kind:'acc',sets:3,reps:10,load:0,rest:60,rir:2,demo:D+'2022/02/releve-de-jambes-suspendu.gif',mm:m('abs','obliques forearms')},
  {id:'hyper',name:'Hyperextension 45° (focus ischios)',kind:'acc',sets:3,reps:8,load:20,rest:90,rir:2,tempo:'3-0-1-1',demo:D+'2021/08/extension-lombaire-au-banc-45.gif',mm:m('hamstrings','glutes lowerBack')},
  {id:'calfse',name:'Élévations de mollets assis',kind:'acc',sets:3,reps:15,load:30,rest:60,rir:1,tempo:'2-1-1-1',demo:D+'2021/10/extension-mollets-assis-machine.gif',mm:m('calves')}]},
 {n:'Squat',focus:'Squat on the cycle, light deadlift and bench',ex:[
  {id:'dll',name:'Deadlift, light session',kind:'light',lift:'deadlift',rest:150,rir:3,tempo:'1-1-X-0',demo:'https://performancessportives.com/souleve-de-terre-avec-pause/',mm:DL,tips:'deadlift'},

/* working load of a cycle lift for a week (same formulas as the sheet) */
function liftLoad(lift,w,off=0){
  const c=CYCLE[w-1],o=S.profile.orm[lift];
  if(lift==='pullup'){ if(w===8)return mr(o); return Math.max(0,mr(PULL_START+(o*.95-PULL_START)*(c.p-.75)/(.95-.75))) }
  return mr(o*(c.p-off));
}
function plan(ex,w=S.profile.week){
  const c=CYCLE[w-1],o=S.profile.orm;
  if(ex.kind==='acc'){const l=S.profile.loads[ex.id]??ex.load;return {sets:Array.from({length:ex.sets},()=>({w:l,r:ex.reps}))}}
  if(ex.kind==='oly'){const l=mr(o[ex.lift]*ex.pct);return {sets:Array.from({length:ex.sets},()=>({w:l,r:ex.reps})),pct:ex.pct}}
  if(ex.kind==='light'){ if(w===8)return {skip:true,sets:[]};
    const l=liftLoad(ex.lift,w,.1);return {sets:Array.from({length:Math.max(2,c.s-2)},()=>({w:l,r:c.r})),pct:c.p-.1}}
  if(w===8){const one=mr(o[ex.lift]);return {boss:true,sets:[{w:mr(one*.9),r:1},{w:one,r:1},{w:one+STEP,r:1}],pct:1}}
  const n=ex.kind==='cap3'?Math.min(3,c.s):c.s,l=liftLoad(ex.lift,w);
  return {sets:Array.from({length:n},()=>({w:l,r:c.r})),pct:ex.lift==='pullup'?l/o.pullup:c.p};
}

const b64u=u=>{let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function pack(o){const raw=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{const z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());return 'z'+b64u(z)}catch(e){}}
  return 'j'+b64u(raw)}
async function unpack(t){const u=ub64(t.slice(1));
  const bytes=t[0]==='z'?new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()):u;
  return JSON.parse(new TextDecoder().decode(bytes))}

/* ---------- Garmin CSV ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');const delim=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);return rows;
}
const gNum=v=>{if(v==null)return null;v=String(v).trim();if(!v||/^-+$/.test(v))return null;v=/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)?v.replace(/,/g,''):v.replace(/\s/g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)?n:null};
const gDur=v=>{const p=String(v||'').trim().split(':').map(x=>parseFloat(x.replace(',','.')));if(p.some(isNaN))return 0;return p.reduce((a,x)=>a*60+x,0)};
function gDate(v){v=String(v||'').trim();let d=new Date(v.replace(' ','T'));
  if(isNaN(d)){const x=v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})(?:\D+(\d{1,2}):(\d{2}))?/);if(x)d=new Date(+x[3],+x[2]-1,+x[1],+(x[4]||12),+(x[5]||0))}
  return isNaN(d)?null:d}
const kindOf=s=>{s=s.toLowerCase();return /run|course|trail|tapis|jog/.test(s)?'RUN':/cycl|bik|v[ée]lo|ride/.test(s)?'BIKE':/strength|muscu|force|weight|halt/.test(s)?'LIFT':/swim|nata|nage/.test(s)?'SWIM':/walk|march|hik|rando/.test(s)?'WALK':'MOVE'};
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2)return toast("That file has no activities in it.");
  const H=rows[0].map(h=>h.trim().toLowerCase()),col=re=>H.findIndex(h=>re.test(h));
  const c={type:col(/type/),date:col(/^date/),title:col(/^tit(le|re)/),dist:col(/^distance/),cal:col(/^calories/),time:col(/^(time|dur[ée]e|temps)$/),
    avg:col(/avg hr|fc moy|cardiaque moy|moyenne/),max:col(/max hr|fc max|cardiaque max/),te:col(/aerobic te|te a[ée]robie/)};
  if(c.date<0||c.type<0)return toast("That doesn't look like a Garmin Connect activities export.");
  let n=0;rows.slice(1).forEach(r=>{const d=gDate(r[c.date]);if(!d)return;const type=(r[c.type]||'').trim(),kind=kindOf(type+' '+(r[c.title]||''));
    let dist=c.dist>=0?gNum(r[c.dist]):null;if(kind==='SWIM'&&dist>100)dist=dist/1000;if(kind==='LIFT')dist=null;
    const a={date:d.toISOString(),type,kind,title:(r[c.title]||'').trim().slice(0,80),durS:Math.round(gDur(r[c.time])),distKm:dist||0,cal:gNum(r[c.cal])||0,avgHr:gNum(r[c.avg])||0,maxHr:gNum(r[c.max])||0,te:c.te>=0?gNum(r[c.te])||0:0,src:'garmin'};
    putDoc('activities','g-'+d.toISOString().replace(/\D/g,'').slice(0,14)+'-'+kind.toLowerCase(),a);n++});
  toast(n?`${n} activit${n===1?'y':'ies'} imported.`:"No readable activities in that file.");render();
}

   ${pr.map(p=>`<p><span class="tag gold">Record</span> ${LIFTS[p.lift]}: <b class="num">${fmt(p.from)} → ${fmt(p.to)} kg</b></p>`).join('')}
   ${after>before?`<p><span class="tag boss">Level up</span> You are now level <b class="num">${after}</b>, ${TITLES[Math.min(after,TITLES.length)-1]}.</p>`:''}
   ${fresh.map(n=>`<p><span class="tag gold">Trophy</span> ${n}</p>`).join('')}
   <p class="small dim">Hit hardest: ${names(hit)}.</p><button class="btn" data-act="winx">Collect</button></div>`;
  $('win').hidden=false;beep(523,.12);setTimeout(()=>beep(659,.12),130);setTimeout(()=>beep(784,.25),260);render();
  const b=$('win').querySelector('button');b&&b.focus();
}

document.addEventListener('click',ev=>{
  const mu=ev.target.closest('[data-mu]');
  if(mu){S.muscle=S.muscle===mu.dataset.mu?null:mu.dataset.mu;return render()}
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,e=EX[b.dataset.ex];
  if(a==='share')return shareProgress();
  if(S.spec&&!['sel','snd','winx'].includes(a))return;
  if(a==='wk'){S.profile.week=Math.min(8,Math.max(1,S.profile.week+ +b.dataset.d));saveProfile();render()}
  else if(a==='snd'){sound=!sound;ls.set('iq-sound',sound);render();beep()}
  else if(a==='day'){S.day=+b.dataset.i;S.sel=null;S.muscle=null;ls.set('iq-day',S.day);render()}
  else if(a==='sel'){S.sel=S.sel===e.id?null:e.id;S.muscle=null;render()}
  else if(a==='set'){const s=touch(e)[+b.dataset.i];s.d=s.d?0:1;saveDrafts();
    if(s.d){const all=DAYS[S.day].ex.every(x=>draftFor(x).every(y=>y.d));if(!all)startRest(e.rest);beep();pop(b,'+'+(hitsBonus(e)?15:10)+' XP');S.sel=e.id;S.muscle=null;
      try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}}
    render()}
  else if(a==='adj'){const k=b.dataset.k,d=+b.dataset.d;touch(e).forEach(s=>{if(!s.d)s[k]=Math.max(k==='r'?1:0,+(s[k]+d).toFixed(2))});saveDrafts();render()}
  else if(a==='finish')finish();
  else if(a==='winx')$('win').hidden=true;
  else if(a==='export')exportBackup();
  else if(a==='rest+'){if(rest){rest.end+=15000;rest.total+=15;tick()}}
  else if(a==='restx'){rest=null;$('rest').hidden=true}
  else if(a==='del'){if(b.dataset.sure)delDoc(b.dataset.col,b.dataset.id);else{b.dataset.sure=1;b.textContent='Sure?';b.style.color='var(--hit)';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Delete';b.style.color=''}},3000)}}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(S.spec)return;
  if(t.dataset.orm){const v=parseFloat(t.value);if(v>0){S.profile.orm[t.dataset.orm]=v;saveProfile();render();toast('Record saved. Quest loads updated.')}}
  if(t.id==='csv'&&t.files[0])t.files[0].text().then(importCSV);
  if(t.id==='restore'&&t.files[0])t.files[0].text().then(restoreBackup);
});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='manual')return;ev.preventDefault();
  const v=id=>$(id).value,min=+v('m-min');if(!(min>0)||!v('m-date'))return;
  const d=new Date(v('m-date')+'T12:00:00'),kind=v('m-kind');
  putDoc('activities','m-'+Date.now(),{date:d.toISOString(),type:kind,kind,title:'',durS:min*60,distKm:+v('m-km')||0,cal:+v('m-cal')||0,avgHr:+v('m-hr')||0,maxHr:0,te:0,src:'manual'});
  toast(`Added. +${Math.min(120,min)} XP`);render();
});
document.addEventListener('dragover',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',ev=>{const d=ev.target.closest&&ev.target.closest('#drop');if(!d)return;ev.preventDefault();d.classList.remove('over');const f=ev.dataTransfer.files[0];if(f)f.text().then(importCSV)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')$('win').hidden=true});
window.addEventListener('hashchange',()=>{S.muscle=null;render();scrollTo(0,0)});
async function exportBackup(){
  const name='iron-quest-backup-'+ymd(new Date())+'.json',text=JSON.stringify({app:'iron-quest',v:1,saved:new Date().toISOString(),profile:S.profile,sessions:S.sessions,activities:S.acts});
  try{const f=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Iron Quest backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Backup saved to your downloads.');
}
function restoreBackup(text){
  let b;try{b=JSON.parse(text)}catch(e){b=null}
  if(!b||b.app!=='iron-quest'||!Array.isArray(b.sessions))return toast("That isn't an Iron Quest backup file.");
  applyProfile(b.profile);ls.set('iq-profile',S.profile);
  const merge=(cur,add)=>{const ids=new Set(cur.map(x=>x.id));return cur.concat((add||[]).filter(x=>x&&x.id&&!ids.has(x.id)))};
  S.sessions=merge(S.sessions,b.sessions);S.acts=merge(S.acts,b.activities);ls.set('iq-sessions',S.sessions);ls.set('iq-activities',S.acts);
  toast('Backup restored.');render();
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
boot();
</script>
